{% extends "base.html" %}
{% block main %}
<div class="container">
  <h2 class="page-heading">Properties</h2>

  <div class="row">
    {% for prop in properties %}
    <div class="col-md-4 mb-4">
      <div class="card property-card">

        <img src="{{ url_for('static', filename='uploads/' + prop.photo) }}" 
             class="card-img-top" alt="{{ prop.title }}">

        <div class="card-body">
          <span class="price-badge">${{ prop.price }}</span>

          <h5 class="card-title">{{ prop.title }}</h5>

          <p class="card-text">📍 {{ prop.location }}</p>

          <a href="{{ url_for('property_detail', propertyid=prop.id) }}" 
             class="btn btn-view">
             View Property
          </a>
        </div>

      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
